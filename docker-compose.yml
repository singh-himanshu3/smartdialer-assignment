services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: smartdialer
      POSTGRES_PASSWORD: smartdialer
      POSTGRES_DB: smartdialer
    ports:
      # Keep the container on PostgreSQL's standard port, but avoid clashing
      # with a PostgreSQL installation running directly on the Windows host.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartdialer -d smartdialer"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - smartdialer-postgres:/var/lib/postgresql/data

volumes:
  smartdialer-postgres:
